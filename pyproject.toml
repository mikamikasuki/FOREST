[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forest-research"
version = "0.1.0"
description = "Open, editable, goal-driven research workspace"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn[standard]", "sqlalchemy", "psycopg[binary]", "pydantic-settings", "PyYAML>=6.0.3,<7", "python-multipart", "httpx", "psutil", "numpy", "pandas", "pyarrow", "scipy", "scikit-learn", "matplotlib", "pillow", "sympy", "pypdf", "pybtex", "websockets", "watchfiles>=1.3.0,<2", "playwright"]

[project.scripts]
forest = "forest_cli.main:main"

[tool.setuptools.packages.find]
include = ["forest_cli*", "research*", "services*", "runners*"]

[tool.setuptools.package-data]
"research.publication" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
