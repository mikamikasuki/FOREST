[project]
name = "forest-research"
version = "0.1.0"
description = "Open, editable, goal-driven research workspace"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn[standard]", "sqlalchemy", "psycopg[binary]", "pydantic-settings", "python-multipart", "httpx", "psutil", "numpy", "pandas", "pyarrow", "scipy", "scikit-learn", "matplotlib", "pillow", "sympy", "pypdf", "pybtex", "websockets", "playwright"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
